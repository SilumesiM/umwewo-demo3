<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umwewo</title>
<style>
:root{--bg:#f3f8f5;--card:#ffffff;--ink:#0e1f16;--mut:#5a6d62;--acc:#0a8f50;--acc-ink:#ffffff;--warn:#c97800;--bad:#d23b3b;--line:#dbe6df;--sh:0 12px 32px rgba(10,60,35,.12);--blob1:#7fe0ae;--blob2:#ffd27a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08120d;--card:#12201a;--ink:#e9f4ee;--mut:#97aa9f;--acc:#2fcf86;--acc-ink:#04140b;--warn:#f0a63a;--bad:#ff6b6b;--line:#23382c;--sh:0 12px 32px rgba(0,0,0,.45);--blob1:#0f6b43;--blob2:#7a5410}}
:root[data-theme="dark"]{--bg:#08120d;--card:#12201a;--ink:#e9f4ee;--mut:#97aa9f;--acc:#2fcf86;--acc-ink:#04140b;--warn:#f0a63a;--bad:#ff6b6b;--line:#23382c;--sh:0 12px 32px rgba(0,0,0,.45);--blob1:#0f6b43;--blob2:#7a5410}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;line-height:1.45}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:float 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:var(--blob1);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--blob2);bottom:-60px;right:-60px;animation-delay:-6s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
.wrap{max-width:980px;margin:auto;padding:16px 16px 56px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:44px}
.brand{font-weight:800;letter-spacing:.3px;font-size:18px}.brand span{color:var(--acc)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.ghost:hover{border-color:var(--acc)}
.hero{text-align:center;padding:28px 0 26px;animation:up .7s both}
.kick{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:14px;margin:0 0 14px;letter-spacing:.5px}
h1{font-size:clamp(46px,13vw,92px);margin:0;line-height:1;font-weight:900;background:linear-gradient(90deg,var(--acc),#f2a900,var(--acc));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{max-width:520px;margin:14px auto 0;color:var(--mut);font-size:17px}
.menu{display:grid;gap:18px;margin-top:22px}
@media(min-width:760px){.menu{grid-template-columns:repeat(2,1fr)}}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:26px 22px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);cursor:pointer;font:inherit;animation:up .7s both;animation-delay:var(--d);transition:transform .25s,border-color .25s}
.role:hover{transform:translateY(-6px);border-color:var(--acc)}
.role b{font-size:20px;display:block}.role small{color:var(--mut);font-size:14px;display:block;margin-top:4px}
.role i{font-style:normal;color:var(--acc);font-weight:700;margin-top:auto;transition:transform .25s}.role:hover i{transform:translateX(6px)}
.ic{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--acc) 16%,transparent);font-size:28px}
.tip{text-align:center;color:var(--mut);margin-top:30px;font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh);animation:up .5s both}
.narrow{max-width:420px;margin:30px auto}
.card h2,.card h3{margin:0 0 12px}.mut{color:var(--mut)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.btn{background:var(--acc);color:var(--acc-ink);border:0;padding:12px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn.sm{padding:8px 14px;font-size:14px}.btn.red{background:var(--bad);color:#fff}.btn.out{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad);min-height:20px;margin:4px 0}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.grid{display:grid;gap:18px;margin-top:14px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.pill.w{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.b{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 4px;width:100%}
.fill{height:100%;border-radius:999px;background:var(--acc);animation:grow 1s ease-out}
.fill.low{background:var(--bad)}@keyframes grow{from{width:0}}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-size:28px;display:block}
.think{text-align:center;padding:30px 10px}
.dots span{display:inline-block;width:12px;height:12px;margin:0 4px;border-radius:50%;background:var(--acc);animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{transform:translateY(-12px);opacity:.4}}
.note{border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);padding:12px 14px;border-radius:10px;margin:12px 0;animation:up .4s both}
.note.w{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.empty{color:var(--mut);padding:8px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;transition:transform .4s;z-index:9;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{display:inline-flex;align-items:center;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink)}
.chip input{display:inline;width:auto;margin:0 6px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{display:grid;place-items:center;align-content:center;gap:4px;height:130px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 25%,var(--card)),var(--card));border:1px solid var(--line);font-size:42px;animation:pulse 2.5s infinite}
.tile small{font-size:13px;color:var(--mut)}@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 15%,transparent)}}
.chat{height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:10px;margin:12px 0;background:var(--bg)}
.msg{max-width:80%;margin:6px 0;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.msg.me{margin-left:auto;background:var(--acc);color:var(--acc-ink)}
.chatf{display:flex;gap:8px}.chatf input{margin:0}a.btn{display:inline-block;text-decoration:none}audio{max-width:100%;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:8;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:12px;padding:6px 2px;border-radius:12px;cursor:pointer;transition:color .2s}
.nav button span{font-size:22px;transition:transform .25s}.nav button.on{color:var(--acc);font-weight:700}.nav button.on span{transform:translateY(-3px) scale(1.18)}
.ghost.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.chips .ghost{padding:10px 14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap"><div class="bar" id="bar"></div><div id="app"></div></div>
<div id="toast"></div>
<script>
const S={user:null,nid:20,
 appts:[{id:1,patient:'patient2',slot:'2026-10-20 09:00',type:'VIRTUAL',symptoms:'Persistent cough for five days',flag:false,status:'BOOKED',doc:1}],
 rx:[{id:1,patient:'patient2',medicine:'Cough syrup',symptoms:'Persistent cough for five days',status:'PENDING',doc:1}],
 stock:[{id:1,c:1,name:'Paracetamol',qty:200,use:15,lead:5},{id:2,c:1,name:'Amoxicillin',qty:40,use:8,lead:7},{id:3,c:1,name:'ORS sachets',qty:500,use:5,lead:3},{id:4,c:1,name:'Malaria test kits',qty:90,use:12,lead:6},{id:5,c:2,name:'Paracetamol',qty:60,use:9,lead:6},{id:6,c:2,name:'Oral rehydration salts',qty:300,use:6,lead:4}],
 reqs:[],notes:[],chat:{},pend:null,room:null,accounts:[],pending:null,draft:{name:'',town:'',phone:'',staff:[]},
 centers:[{id:1,name:'Chilenje Community Hospital',town:'Lusaka',phone:'+260 211 000 111',type:'Class A',lic:'DEMO-0001',exp:'2027-12-31',status:'APPROVED'},{id:2,name:'Copperbelt Health Centre',town:'Kitwe',phone:'+260 212 000 222',type:'Class B',lic:'DEMO-0002',exp:'2027-12-31',status:'APPROVED'}],
 docs:[{id:1,c:1,name:'Dr. Mulenga Phiri',role:'General practitioner',user:'doctor1',days:[1,2,3,4,5],from:'08:00',to:'16:00'},{id:2,c:1,name:'Dr. Chanda Zulu',role:'Paediatrician',user:'dr.chanda',days:[2,4,6],from:'09:00',to:'14:00'},{id:3,c:2,name:'Dr. Natasha Mwale',role:'Family physician',user:'dr.natasha',days:[1,2,3,4,5],from:'10:00',to:'18:00'}]};
const R={
 patient:{ic:'❤️',t:'Umwewo for patients',d:'Book visits, start a virtual checkup and get your prescriptions.',u:'patient1'},
 doctor:{ic:'🩺',t:'Umwewo for doctors',d:'Review AI-suggested prescriptions and manage appointments.',u:'doctor1'},
 inventory:{ic:'📦',t:'Umwewo for inventory staff',d:'Watch stock levels and approve AI restock requests.',u:'stock1'},
 center:{ic:'🏥',t:'Umwewo for medical centers',d:'Register your hospital and manage your doctors and inventory staff.',u:'manager1'},
 admin:{ic:'🛡️',t:'Umwewo verification team',d:'Check licences.',u:'admin1'}};
let view='home',role=null,busy=false,last=null,scanning=false;
const app=document.getElementById('app'),bar=document.getElementById('bar');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),2600)}
function go(v,r){view=v;if(r)role=r;if(v==='home')S.user=null;last=null;S.pend=null;draw();window.scrollTo(0,0)}
function draw(){save();
 bar.innerHTML='<div class="brand">Um<span>wewo</span></div>'+(view==='home'?'':'<button class="ghost" onclick="go(\'home\')">'+(S.user?'Log out':'← Menu')+'</button>');
 app.innerHTML=view==='home'?home():view==='login'?login():view==='register'?register():view==='signup'?signup():view==='confirm'?confirmPage():view==='room'?room():shell();
}
function home(){return `<section class="hero"><p class="kick">Welcome</p><h1>Umwewo</h1><p class="sub">Care, appointments and medicine stock for hospitals in Zambia, all in one place.</p></section>
<div class="menu">${Object.entries(R).filter(([k])=>k!=='admin').map(([k,r],i)=>`<button class="role" style="--d:${i*130+250}ms" onclick="go('login','${k}')"><span class="ic">${r.ic}</span><span><b>${r.t}</b><small>${r.d}</small></span><i>${k==='center'?'Log in or register →':'Log in →'}</i></button>`).join('')}</div>
<p class="tip">Demo tip: book a visit as a patient, then log in as a doctor to approve it.<br><a href="#" style="color:var(--acc)" onclick="go('login','admin');return false">Verification team login</a> · <a href="#" style="color:var(--acc)" onclick="resetDemo();return false">Reset demo data</a></p>`}
function login(){const r=R[role];return `<div class="card narrow" id="lg"><span class="ic">${r.ic}</span><h2 style="margin-top:12px">${r.t}</h2><p class="mut">Demo account is already filled in.</p>
<form onsubmit="signin(event)"><label>Username<input id="u" value="${r.u}" autocomplete="off"></label><label>Password<input id="p" type="password" value="pass"></label><p class="err" id="err"></p><button class="btn" style="width:100%">Sign in</button></form>${role==='admin'?'':'<p class="mut" style="text-align:center;margin-top:14px">New here? <a href="#" style="color:var(--acc)" onclick="signupGo();return false">'+(role==='center'?'Register your center':'Create an account')+'</a></p>'}</div>`}
function signin(e){e.preventDefault();const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
 if(role==='doctor'?S.docs.some(d=>d.user===u&&(d.pw||'pass')===p&&okC(ctr(d.c))):(p==='pass'&&u===R[role].u)){S.user=u;tab='dash';view='app';draw();toast('Welcome, '+u)}
 else{document.getElementById('err').textContent='Wrong username or password, or your center is not verified yet.';const c=document.getElementById('lg');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}}

/* ---------- AI stand-ins ---------- */
function analyse(t,fs){t=t.toLowerCase();
 const flag=['chest pain','bleeding','breathing','unconscious','severe'].some(w=>t.includes(w));
 let med=null;if(/fever|headache/.test(t))med='Paracetamol 500mg';else if(/diarrh/.test(t))med='ORS sachets';else if(/infection/.test(t))med='Amoxicillin 500mg';else if(/cough/.test(t))med='Cough syrup';
 let sev=flag?'urgent':/days|week|worse|persistent|vomit|fever/.test(t)?'moderate':'mild';const rank={mild:0,moderate:1,urgent:2},f=fs==='unsure'?'moderate':fs;if(f&&rank[f]>rank[sev])sev=f;return{flag:flag||sev==='urgent',med,sev,tip:TIPS[sev],unsure:fs==='unsure'}}

/* ---------- patient ---------- */
function patient(){
 const a=S.appts.filter(x=>x.patient===S.user),r=S.rx.filter(x=>x.patient===S.user);
 const form=busy?`<div class="think"><div class="dots"><span></span><span></span><span></span></div><p class="mut">AI is reading your symptoms…</p></div>`:
 `<form onsubmit="book(event)"><label>Type<select id="ty"><option value="VIRTUAL">Virtual checkup (video)</option><option value="PHYSICAL">Physical visit</option></select></label>
 <label>Preferred date and time<input id="sl" type="datetime-local" value="2026-10-20T09:00"></label>
 <label>Describe your symptoms<textarea id="sy" rows="3" required placeholder="e.g. fever and headache since yesterday"></textarea></label><button class="btn">Submit</button></form>`;
 const res=last&&!busy?`<div class="note ${last.flag?'w':''}"><b>${last.flag?'⚠️ We recommend seeing a doctor in person.':'✅ Checkup booked.'}</b><br>${last.flag?'A doctor will review your case and can turn this into a physical appointment.':'A doctor will see your virtual checkup at the chosen time.'}${last.med?'<br>A medicine suggestion was sent to a doctor for approval.':''}</div>`:'';
 return `<h2>Hello, ${esc(S.user)} 👋</h2><div class="grid two"><div class="card"><h3>Book a visit or virtual checkup</h3>${form}${res}</div>
 <div class="grid"><div class="card"><h3>My appointments</h3>${a.length?a.map(x=>`<div class="row"><span>${esc(x.slot.replace('T',' '))}<br><small class="mut">${esc(x.symptoms)}</small></span><span class="pill ${x.type==='PHYSICAL'?'w':''}">${x.type==='PHYSICAL'?'In person':'Virtual'}</span></div>`).join(''):'<p class="empty">No appointments yet.</p>'}</div>
 <div class="card"><h3>My prescriptions</h3>${r.length?r.map(x=>`<div class="row"><b>${x.status==='APPROVED'?esc(x.medicine):'Waiting for doctor'}</b><span class="pill ${x.status==='APPROVED'?'':x.status==='REJECTED'?'b':'w'}">${x.status==='APPROVED'?'Approved':x.status==='REJECTED'?'Declined':'Pending'}</span></div>`).join(''):'<p class="empty">Nothing yet.</p>'}</div></div></div>`}
function book(e){e.preventDefault();const sy=document.getElementById('sy').value,ty=document.getElementById('ty').value,sl=document.getElementById('sl').value;
 busy=true;draw();setTimeout(()=>{const a=analyse(sy);
  S.appts.push({id:S.nid++,patient:S.user,slot:sl,type:ty,symptoms:sy,flag:a.flag,status:'BOOKED'});
  if(a.med)S.rx.push({id:S.nid++,patient:S.user,medicine:a.med,symptoms:sy,status:'PENDING'});
  last=a;busy=false;draw()},1600)}

/* ---------- doctor ---------- */
function doctor(){
 const p=S.rx.filter(x=>x.status==='PENDING');
 return `<h2>Doctor section</h2><div class="stats"><div class="stat"><b>${p.length}</b>prescriptions to approve</div><div class="stat"><b>${S.appts.filter(x=>x.flag).length}</b>need an in-person visit</div></div>
 <div class="grid two"><div class="card"><h3>AI-suggested prescriptions</h3>${p.length?p.map(x=>`<div class="row"><span><b>${esc(x.medicine)}</b><br><small class="mut">${esc(x.patient)}: ${esc(x.symptoms)}</small></span><span class="btns"><button class="btn sm" onclick="decide(${x.id},'APPROVED')">Approve</button><button class="btn sm red" onclick="decide(${x.id},'REJECTED')">Reject</button></span></div>`).join(''):'<p class="empty">All caught up ✅</p>'}</div>
 <div class="card"><h3>Appointments</h3>${S.appts.map(x=>`<div class="row"><span>${esc(x.patient)}, ${esc(x.slot.replace('T',' '))}<br><small class="mut">${esc(x.symptoms)}</small><br>${x.flag?'<span class="pill b">AI: see in person</span> ':''}<span class="pill ${x.type==='PHYSICAL'?'w':''}">${x.type==='PHYSICAL'?'In person':'Virtual'}</span></span>${x.type==='VIRTUAL'?`<button class="btn sm out" onclick="phys(${x.id})">Make physical</button>`:''}</div>`).join('')}</div></div>`}
function decide(id,s){S.rx.find(x=>x.id===id).status=s;draw();toast(s==='APPROVED'?'Approved. The patient can now see it.':'Rejected.')}
function phys(id){S.appts.find(x=>x.id===id).type='PHYSICAL';draw();toast('Appointment is now in person.')}

/* ---------- inventory ---------- */
const days=i=>i.qty/Math.max(i.use,.1),low=i=>days(i)<=i.lead+7;
function inventory(){
 const wait=S.reqs.filter(x=>x.status==='AWAITING');
 return `<h2>Inventory</h2><div class="stats"><div class="stat"><b>${S.stock.filter(low).length}</b>items running low</div><div class="stat"><b>${wait.length}</b>requests awaiting you</div></div>
 <div class="grid two"><div class="card"><h3>Stock levels</h3>${S.stock.map(i=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(i.name)}</b>${low(i)?'<span class="pill b">Shortage soon</span>':'<span class="pill">OK</span>'}</div>
 <div class="track"><div class="fill ${low(i)?'low':''}" style="width:${Math.min(100,days(i)/30*100)}%"></div></div>
 <small class="mut">${i.qty} left · about ${Math.round(days(i))} days · delivery takes ${i.lead} days</small> <button class="btn sm out" style="margin-left:6px" onclick="useStock(${i.id})">Log 10 used</button></div>`).join('')}
 <button class="btn" style="margin-top:12px" onclick="check()" ${scanning?'disabled':''}>${scanning?'🤖 Scanning usage…':'🤖 Run AI shortage check'}</button></div>
 <div class="card"><h3>Restock requests</h3>${S.reqs.length?S.reqs.map(x=>`<div class="row"><span><b>${x.qty} × ${esc(x.name)}</b><br><small class="mut">Drafted by AI agent</small></span>${x.status==='AWAITING'?`<button class="btn sm" onclick="send(${x.id})">Confirm and send</button>`:'<span class="pill">Sent to supplier</span>'}</div>`).join(''):'<p class="empty">No requests yet. Run the AI check.</p>'}
 ${wait.length?'<div class="note w">Nothing is sent to suppliers until you confirm.</div>':''}</div></div>`}
function check(){scanning=true;draw();setTimeout(()=>{let n=0;
 S.stock.forEach(i=>{if(low(i)&&!S.reqs.some(r=>r.name===i.name&&r.status==='AWAITING')){S.reqs.push({id:S.nid++,name:i.name,qty:Math.ceil(i.use*30),status:'AWAITING'});n++}});
 scanning=false;draw();toast(n?`AI drafted ${n} restock request${n>1?'s':''}`:'Stock looks healthy.')},1400)}
function useStock(id){const i=S.stock.find(x=>x.id===id);i.qty=Math.max(0,i.qty-10);i.use=.7*i.use+.3*10;draw()}
function send(id){S.reqs.find(x=>x.id===id).status='SENT';draw();toast('Request sent to supplier ✅')}
/* ---------- v2: centers, doctor choice, chat room, voice notes (these replace the earlier patient, doctor and book) ---------- */

 if(S.accounts.some(a=>a.user===user)||S.docs.some(d=>d.user===user)||['patient1','patient2','stock1','admin1','doctor1'].includes(user))return fail('That username is taken.');

 S.accounts.push({user,email,name:g('mn'),pw,role:'center',c:id,ok:true,confirmed:false,code:String(Math.floor(100000+Math.random()*900000))});
 S.draft={name:'',town:'',phone:'',staff:[]};S.pending=user;role='center';view='confirm';draw()}
function cDash(){const c=myCtr(),dr=S.docs.filter(d=>d.c===c.id&&!d.removed&&!d.pending),inv=S.accounts.filter(a=>a.role==='inventory'&&a.c===c.id),
 st=okC(c)?pill('Verified'):c.status==='PENDING'?pill('Awaiting verification','w'):pill(c.status==='APPROVED'?'Licence expired':c.status.toLowerCase(),'b');
 return `<h2>${esc(c.name)}</h2><p class="mut">${esc(c.town)} · ${esc(c.type||'')} · Licence ${esc(c.lic)} (expires ${esc(c.exp)})</p>${st}
 ${okC(c)?'':'<div class="note w" style="margin-top:12px">Patients cannot see your center, and your staff cannot log in, until the verification team approves your licence.</div>'}
 <div class="stats"><div class="stat"><b>${dr.length}</b>doctors</div><div class="stat"><b>${inv.length}</b>inventory staff</div><div class="stat"><b>${S.stock.filter(i=>i.c===c.id).length}</b>stock items</div><div class="stat"><b>${S.appts.filter(a=>a.doc&&doc(a.doc).c===c.id).length}</b>appointments</div><div class="stat"><b>${kw(S.pay.filter(p=>p.c===c.id&&p.status==='PAID').reduce((s,p)=>s+p.amount,0))}</b>received</div></div>
 <div class="card"><h3>Quick actions</h3><button class="btn" onclick="tab='staff';draw()">Manage staff</button></div>`}
function cStaff(){const c=myCtr(),dr=S.docs.filter(d=>d.c===c.id&&!d.removed),inv=S.accounts.filter(a=>a.role==='inventory'&&a.c===c.id);
 return `<h2>Staff</h2><div class="card"><h3>Doctors</h3>${dr.length?dr.map(d=>`<div class="row"><span><b>${esc(d.name)}</b> ${d.pending?pill('Pending','w'):''}<br><small class="mut">${esc(d.role)} · ${d.days.map(x=>DAYS[x]).join(', ')} · ${d.from}–${d.to}<br>username: ${esc(d.user)}${d.hpcz?' · HPCZ '+esc(d.hpcz):''}</small></span><button class="btn sm red" onclick="rmDoc(${d.id})">Remove</button></div>`).join(''):'<p class="empty">No doctors yet.</p>'}</div>
 <div class="card" ${gap}><h3>Inventory staff</h3>${inv.length?inv.map(a=>`<div class="row"><span><b>${esc(a.name)}</b><br><small class="mut">username: ${esc(a.user)}</small></span><button class="btn sm red" onclick="rmInv('${a.user}')">Remove</button></div>`).join(''):'<p class="empty">No inventory staff yet.</p>'}</div>
 <div class="card" ${gap}><h3>Add staff</h3><form onsubmit="addStaffC(event)"><label>Staff type<select onchange="kind=this.value;draw()"><option value="doctor" ${kind==='doctor'?'selected':''}>Doctor</option><option value="inventory" ${kind==='inventory'?'selected':''}>Inventory staff</option></select></label>
 <label>Full name<input id="kn" required></label><label>Username<input id="ku" required autocomplete="off"></label><label>Password (6+ characters)<input id="kp" type="password" minlength="6" required></label>
 ${kind==='doctor'?`<label>HPCZ registration number<input id="kh"></label><label>Consultation fee (ZMW)<input id="kg" type="number" min="1" value="100"></label><label>Role or specialty<input id="kr" placeholder="e.g. Surgeon"></label><div class="chips">${DAYS.map((d,i)=>`<label class="chip"><input type="checkbox" class="sd" value="${i}" ${i>0&&i<6?'checked':''}>${d}</label>`).join('')}</div><div class="btns"><label style="flex:1">From<input id="kf" type="time" value="08:00"></label><label style="flex:1">To<input id="ke" type="time" value="16:00"></label></div>`:''}
 <button class="btn">Add staff member</button></form></div>`}
function addStaffC(e){e.preventDefault();const c=myAcc().c,g=id=>document.getElementById(id).value.trim(),user=g('ku').toLowerCase().replace(/\s+/g,''),pw=document.getElementById('kp').value;
 if(taken(user))return toast('That username is taken.');
 if(kind==='doctor'){if(!g('kh'))return toast('Enter the HPCZ registration number.');
  S.docs.push({id:S.nid++,c,name:g('kn'),role:g('kr')||'Doctor',user,pw,hpcz:g('kh'),fee:+g('kg')||100,days:[...document.querySelectorAll('.sd:checked')].map(x=>+x.value),from:g('kf'),to:g('ke')})}
 else S.accounts.push({user,email:'',name:g('kn'),pw,role:'inventory',c,ok:true,confirmed:true});
 draw();toast('Staff member added. They log in with the username and password you set.')}
function rmDoc(id){doc(id).removed=true;draw();toast('Doctor removed.')}
function rmInv(u){S.accounts=S.accounts.filter(a=>a.user!==u);draw();toast('Staff member removed.')}
load();fix();if(!S.accounts.some(a=>a.user==='manager1'))S.accounts.push(MGR);
/* ---------- v8: payments ---------- */
TABS.center=[['dash','🏠','Home'],['staff','👥','Staff'],['pays','💰','Payments'],['acct','👤','Account']];
const METHODS=[['mtn','MTN Mobile Money','mm'],['airtel','Airtel Money','mm'],['zamtel','Zamtel Kwacha','mm'],['card','Visa or Mastercard','card'],['bank','Bank transfer','bank'],['cash','Pay at the facility','cash']];
let method='mtn',payBusy=false;
const feeOf=d=>d.fee||100,kw=n=>'K'+Number(n).toLocaleString('en-US');
const payPill=id=>{const p=S.pay.find(z=>z.appt===id);return p?pill(p.status==='PAID'?'Paid '+kw(p.amount):'Payment pending '+kw(p.amount),p.status==='PAID'?'':'w'):''};
const payRows=u=>{const l=S.pay.filter(p=>p.patient===u).slice().reverse();return l.length?l.map(p=>`<div class="row"><span><b>${kw(p.amount)}</b> - ${esc(p.method)}${p.info?' '+esc(p.info):''}<br><small class="mut">Receipt ${esc(p.ref)} - ${esc(doc(p.doc).name)}</small></span>${pill(p.status==='PAID'?'Paid':'Pending',p.status==='PAID'?'':'w')}</div>`).join(''):'<p class="empty">No payments yet.</p>'};
function pickDoc(id){S.payFor=id;method='mtn';draw();window.scrollTo(0,0)}
function payPage(){const d=doc(S.payFor),c=ctr(d.c),p=S.pend,m=METHODS.find(x=>x[0]===method),k=m[2];
 if(payBusy)return think(k==='mm'?'Waiting for you to approve the payment on your phone…':'Processing your payment…');
 const f={mm:'<label>Mobile money number<input id="pp" inputmode="tel" placeholder="e.g. 0971234567"></label><p class="mut">You will get a prompt on your phone to approve the payment.</p>',
  card:'<label>Card number<input id="pc" inputmode="numeric" placeholder="1234 5678 9012 3456" autocomplete="off"></label><div class="btns"><label style="flex:1">Expiry (MM/YY)<input id="pe" placeholder="08/28"></label><label style="flex:1">CVV<input id="pv" inputmode="numeric" maxlength="4" type="password"></label></div><p class="mut">Demo only. Card details are never saved.</p>',
  bank:'<p class="mut">Transfer the fee to the center bank account. The center confirms once the money arrives. Your request goes to the doctor now.</p>',
  cash:'<p class="mut">Pay at the front desk when you arrive. Your request goes to the doctor now, and the center marks the payment received.</p>'}[k];
 return `<h2>Payment</h2><div class="card"><h3>Your request</h3><div class="row"><span>Doctor</span><b>${esc(d.name)}</b></div><div class="row"><span>Hospital</span><b>${esc(c.name)}</b></div><div class="row"><span>When</span><b>${esc(p.sl.replace('T',' '))}</b></div><div class="row"><span>Visit</span><b>${p.ty==='VIRTUAL'?'Virtual checkup':'Physical visit'}</b></div><div class="row"><span>Consultation fee</span><b>${kw(feeOf(d))}</b></div></div>
 <div class="card" ${gap}><h3>Choose how to pay</h3><div class="chips">${METHODS.map(x=>`<button type="button" class="ghost ${x[0]===method?'on':''}" onclick="method='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>${f}
 <div class="btns"><button class="btn" onclick="payNow()">${k==='cash'||k==='bank'?'Send request':'Pay '+kw(feeOf(d))+' and send request'}</button><button class="btn out" onclick="S.payFor=null;draw()">Back</button></div></div>`}
function payNow(){const m=METHODS.find(x=>x[0]===method),k=m[2],g=id=>(document.getElementById(id)||{}).value||'';let info='';
 if(k==='mm'){const ph=g('pp').replace(/\D/g,'');if(ph.length<9)return toast('Enter your mobile money number.');info='****'+ph.slice(-4)}
 if(k==='card'){const n=g('pc').replace(/\D/g,'');if(n.length<13||!/^\d\d\/\d\d$/.test(g('pe').trim())||g('pv').length<3)return toast('Check the card number, expiry (MM/YY) and CVV.');info='ending '+n.slice(-4)}
 const instant=k==='mm'||k==='card';payBusy=true;draw();
 setTimeout(()=>{payBusy=false;const ref='UMW-'+Math.random().toString(36).slice(2,8).toUpperCase();
  bookDoc(S.payFor,{method:m[1],info,status:instant?'PAID':'PENDING',ref,paidAt:new Date().toISOString().slice(0,16).replace('T',' ')});S.payFor=null;
  toast(instant?'Payment received. Request sent to the doctor.':'Request sent. Payment stays pending until the center confirms it.')},instant?2000:600)}
function cPays(){const c=myCtr(),l=S.pay.filter(p=>p.c===c.id).slice().reverse(),paid=l.filter(p=>p.status==='PAID'),pend=l.filter(p=>p.status==='PENDING'),sum=a=>a.reduce((s,p)=>s+p.amount,0),
 by=METHODS.map(m=>[m[1],sum(paid.filter(p=>p.method===m[1]))]).filter(x=>x[1]);
 return `<h2>Payments</h2><div class="stats"><div class="stat"><b>${kw(sum(paid))}</b>received</div><div class="stat"><b>${kw(sum(pend))}</b>pending</div><div class="stat"><b>${l.length}</b>payments</div></div>
 <div class="card"><h3>Received by method</h3>${bars(by,Math.max(...by.map(x=>x[1]),1))||'<p class="empty">Nothing received yet.</p>'}</div>
 <div class="card" ${gap}><h3>Transactions</h3>${l.length?l.map(p=>`<div class="row"><span><b>${kw(p.amount)}</b> - ${esc(p.method)}${p.info?' '+esc(p.info):''}<br><small class="mut">${esc(pn(p.patient))} - ${esc(doc(p.doc).name)} - ${esc(p.ref)}</small></span><span class="btns">${pill(p.status==='PAID'?'Paid':'Pending',p.status==='PAID'?'':'w')}${p.status==='PENDING'?`<button class="btn sm" onclick="markPaid(${p.id})">Mark received</button>`:''}</span></div>`).join(''):'<p class="empty">No payments yet.</p>'}</div>`}
function markPaid(id){const p=S.pay.find(x=>x.id===id);p.status='PAID';draw();toast('Payment marked as received.')}
S.pay=S.pay||[];S.docs.forEach(d=>{if(!d.fee)d.fee={1:150,2:200,3:120}[d.id]||100});
draw();
</script>
